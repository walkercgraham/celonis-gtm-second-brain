# Stakeholder Search Query Templates
# Organized by research category
#
# Replace [Name], [Company], [Title], [Industry], [Year] with actual values
# Example: [Name] = "Ibrahim Al Buainain", [Company] = "Saudi Aramco"
#
# WEB SEARCH APPROACH:
# Use DuckDuckGo HTML endpoint for search, then fetch top results
#
# Step 1: Search via DuckDuckGo
#   WebFetch URL: https://html.duckduckgo.com/html/?q=[URL-encoded-query]
#   Prompt: "Extract all search result URLs and titles"
#
# Step 2: Fetch top 3-5 relevant URLs
#   WebFetch each URL with targeted extraction prompt
#
# Step 3: If DuckDuckGo fails, try Google (may redirect to consent)
#   WebFetch URL: https://www.google.com/search?q=[URL-encoded-query]

metadata:
  purpose: "Search query templates for stakeholder research"
  version: "1.1"
  last_updated: "2026-04-07"

# =============================================================================
# DUCKDUCKGO SEARCH URLs (Primary Method)
# =============================================================================
duckduckgo_searches:
  base_url: "https://html.duckduckgo.com/html/?q="

  profile_searches:
    - query: "[Name]+[Company]+[Title]"
      example: "https://html.duckduckgo.com/html/?q=Ibrahim+Al+Buainain+Saudi+Aramco+EVP+Manufacturing"
    - query: "[Name]+[Company]+biography"
      example: "https://html.duckduckgo.com/html/?q=Ibrahim+Al+Buainain+Saudi+Aramco+biography"
    - query: "[Name]+[Company]+LinkedIn"
      example: "https://html.duckduckgo.com/html/?q=Ibrahim+Al+Buainain+Saudi+Aramco+LinkedIn"

  career_searches:
    - query: "[Name]+appointed+[Company]"
    - query: "[Name]+[Company]+career+history"
    - query: "[Name]+previously+[Title]"

  statements_searches:
    - query: "[Name]+[Company]+interview"
    - query: "[Name]+[Company]+keynote+conference"
    - query: "[Name]+[Company]+quote"

  verification_searches:
    - query: "[Company]+[Title]+appointed+[Year]"
      purpose: "Verify the actual person in the role matches input name"

# =============================================================================
# BASIC PROFILE
# =============================================================================
basic_profile:
  linkedin:
    - "site:linkedin.com/in [Name] [Company]"
    - "[Name] [Title] [Company] LinkedIn"
    - "[Name] [Company] LinkedIn profile"

  company_bio:
    - "site:[company-domain] [Name]"
    - "[Company] executive team [Name]"
    - "[Company] leadership [Name]"
    - "[Company] [Name] biography"
    - "[Name] [Company] executive bio"

  appointment_announcement:
    - "[Name] appointed [Company]"
    - "[Name] named [Title] [Company]"
    - "[Name] joins [Company]"
    - "[Name] promoted [Company]"
    - "[Company] announces [Name] [Title]"

# =============================================================================
# CAREER BACKGROUND
# =============================================================================
career_background:
  career_history:
    - "[Name] career history"
    - "[Name] previously [Company]"
    - "[Name] former [Title]"
    - "[Name] experience background"
    - "[Name] professional history"

  previous_companies:
    - "[Name] before [Company]"
    - "[Name] prior to [Company]"
    - "[Name] earlier career"
    - "[Name] previous roles"

  education:
    - "[Name] [Company] education"
    - "[Name] MBA OR university OR degree"
    - "[Name] [Company] graduate"
    - "[Name] studied OR educated"

  achievements:
    - "[Name] [Company] award"
    - "[Name] [Company] recognition"
    - "[Name] [Company] achievement"
    - "[Name] industry award"

# =============================================================================
# PUBLIC STATEMENTS
# =============================================================================
public_statements:
  interviews:
    - "[Name] [Company] interview"
    - "[Name] [Company] Q&A"
    - "[Name] [Company] conversation"
    - "[Name] speaks about"

  podcasts:
    - "[Name] [Company] podcast"
    - "[Name] podcast interview"
    - "[Name] podcast guest"

  conferences:
    - "[Name] keynote"
    - "[Name] [Company] conference"
    - "[Name] summit OR forum"
    - "[Name] speaking [Industry]"
    - "[Name] [Industry] conference [Year]"
    - "[Name] panel discussion"
    - "[Name] presented"

  media_quotes:
    - "[Name] [Company] says"
    - "[Name] [Company] stated"
    - "[Name] [Company] announced"
    - "[Name] quote"
    - "[Name] [Company] commented"

# =============================================================================
# PROFESSIONAL ACTIVITIES
# =============================================================================
professional_activities:
  board_roles:
    - "[Name] board director"
    - "[Name] board member"
    - "[Name] advisory board"
    - "[Name] non-executive director"

  publications:
    - "[Name] authored"
    - "[Name] published"
    - "[Name] wrote"
    - "[Name] article"
    - "[Name] book"

  associations:
    - "[Name] member [Industry] association"
    - "[Name] fellow"
    - "[Name] council member"

