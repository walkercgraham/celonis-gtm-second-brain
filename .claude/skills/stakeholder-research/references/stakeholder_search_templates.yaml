# =============================================================================
# RECENCY FILTERS
# =============================================================================
recency_filters:
  recent_activity:
    - "[Name] [Company] [Year]"
    - "[Name] [Company] recent"
    - "[Name] latest news"

  date_filters:
    # Google search date operators
    - "[Name] after:[Year-1]-01-01"
    - "[Name] [Company] 2026 OR 2025"

# =============================================================================
# SEARCH OPERATORS
# =============================================================================
search_operators:
  site_specific:
    - "site:linkedin.com [Name] [Company]"
    - "site:[company-domain] [Name]"
    - "site:bloomberg.com [Name]"
    - "site:reuters.com [Name] [Company]"

  exact_phrase:
    - '"[Full Name]" [Company]'
    - '"[Name]" "[Title]"'

  exclusions:
    # Exclude common false positives
    - "[Name] [Company] -LinkedIn -Facebook -Twitter"

