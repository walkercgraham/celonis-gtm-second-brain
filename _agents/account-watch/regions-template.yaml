    S10_jobs: ["linkedin.com/jobs", "stepstone.de"]
    S11_tenders: ["ted.europa.eu", "simap.ch"]

# S9: companies whose announcements naming an account are TECH-VENDOR signals (set vendor_group to the key).
vendors:
  frontier_ai_labs: ["Anthropic", "OpenAI", "Google DeepMind", "Gemini Enterprise", "Mistral AI", "Cohere", "xAI"]
  regional_ai: ["G42", "Core42", "Inception", "Presight", "Humain", "e& enterprise"]
  data_ai_platforms: ["Databricks", "Snowflake", "Palantir", "Microsoft Fabric", "Azure OpenAI", "Microsoft Copilot",
                      "AWS Bedrock", "Google Vertex AI", "Scale AI"]
  emerging_ai_transformation: ["Sierra", "Glean", "Writer", "Harvey", "Cognition", "Decagon", "Faculty", "Aily Labs",
                               "Dataiku", "H2O.ai"]
  consultancies_si: ["Accenture", "Deloitte", "PwC", "EY", "KPMG", "McKinsey QuantumBlack", "BCG X", "Capgemini", "TCS",
                     "Infosys", "Wipro", "Genpact", "IBM Consulting"]
  process_intelligence: ["SAP Signavio", "SAP LeanIX", "UiPath", "ServiceNow", "Microsoft Power Automate Process Mining",
                         "ARIS", "Appian", "Pega", "Automation Anywhere", "IBM Process Mining"]

# Query templates per source type. Placeholders: {name} legal name, {alias}, {exec} an executive's name, {month} "October 2026",
# {site_list} "site:a OR site:b" built from the region pack's list for that source type, {vendor} a vendors: entry.
# {name_ar} the Arabic legal name from the profile (GCC accounts only).
queries:
  S1: ['"{name}" (annual report OR "integrated report" OR "capital markets day" OR "investor presentation") {month}']
  S2: ['"{name}" (results OR "trading update" OR "earnings call" OR guidance) {month}', '{site_list} "{name}"']
  S3: ['{site_list} "{name}"', '"{name}" (appoints OR appointment OR resigns OR "steps down") (CEO OR CFO OR CIO OR director) {month}']
  S4: ['"{name}" (announces OR launches OR partnership OR "selects") {month}', '"{exec}" interview {month}']
  S5: ['{site_list} "{name}"', '"{name}" (fine OR enforcement OR regulator OR mandate) {month}']
  S6: ['"{name}" (Moody''s OR "S&P" OR Fitch OR rating OR bond OR sukuk) {month}']
  S7: ['"{name}" (restructuring OR "job cuts" OR layoffs OR redundancies OR acquisition OR divest OR "cost cutting") {month}',
       '{site_list} "{name}" {month}']
  S8: ['{site_list} "{name}"']
  S9: ['"{name}" ("{vendor}") (selects OR partnership OR deploys OR "customer story" OR agreement)',
       '"{name}" (Anthropic OR OpenAI OR Databricks OR Palantir OR Snowflake OR "AI partnership")',
       '"{name}" (Signavio OR UiPath OR ServiceNow OR "process mining" OR Celonis)']
  S10: ['{site_list} "{name}" ("process excellence" OR "process mining" OR "AI CoE" OR transformation OR S/4HANA OR automation)']
  S11: ['{site_list} "{name}"']
  S12: ['"{exec}" (joins OR "new role" OR appointed OR "steps down") {month}', 'site:linkedin.com/posts "{name}" "{exec}"']
  arabic: ['"{name_ar}" (إعادة هيكلة OR تعيين OR استحواذ OR الذكاء الاصطناعي OR نتائج)']
