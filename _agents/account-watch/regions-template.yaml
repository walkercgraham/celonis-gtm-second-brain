# Account Watch — region packs, vendor watchlist and query templates. You maintain this file; the agent reads it only.
# An account's region comes from its hub frontmatter `region:` (else the profile infers it from HQ).
# Region codes: uk · ie · gcc-ae · gcc-sa · gcc-qa · gcc-kw · gcc-bh · gcc-om · za · us · ca · eu-de · eu-fr · eu-nl · eu-be
# To switch on a region set `mode: active`. Activate only the regions you have active accounts in.
#
# Source types (tier): S1 annual reports / investor decks (1) · S2 results, trading updates, transcripts (1) ·
# S3 exchange (1) / registry (2) filings · S4 company newsroom, exec interviews, keynotes (1) · S5 regulators, government,
# state media (2) · S6 ratings, bonds, sukuk (2) · S7 tier-1 business press (3) · S8 trade press, analyst coverage (4) ·
# S9 vendor / SI / AI-company / competitor announcements (3–4) · S10 job postings (5) · S11 public tenders (2) ·
# S12 executive social posts, people moves (5)

regions:
  uk:
    mode: inactive
    codes: [uk]
    S3_exchange: ["londonstockexchange.com (RNS)", "investegate.co.uk"]
    S3_registry: ["find-and-update.company-information.service.gov.uk (Companies House officers + filings)"]
    S5_regulators: ["fca.org.uk", "bankofengland.co.uk/prudential-regulation", "gov.uk/cma", "ico.org.uk",
                    "ofgem.gov.uk", "ofwat.gov.uk", "gov.uk/mhra", "caa.co.uk", "orr.gov.uk"]
    S5_government: ["gov.uk"]
    S6_ratings: ["moodys.com", "spglobal.com/ratings", "fitchratings.com"]
    S7_press: ["ft.com", "reuters.com", "bloomberg.com", "thetimes.co.uk", "cityam.com", "theguardian.com/business"]
    S8_trade: ["computerweekly.com", "uktech.news", "sifted.eu", "insurancetimes.co.uk", "insuranceage.co.uk",
               "pharmatimes.com", "pharmaceutical-technology.com"]
    S10_jobs: ["linkedin.com/jobs", "uk.indeed.com"]
    S11_tenders: ["find-tender.service.gov.uk", "contractsfinder.service.gov.uk"]
  ie:
    mode: inactive
    codes: [ie]
    S3_exchange: ["euronext.com/en/markets/dublin"]
    S3_registry: ["cro.ie"]
    S5_regulators: ["centralbank.ie", "dataprotection.ie", "cru.ie", "hpra.ie", "ccpc.ie"]
    S5_government: ["gov.ie"]
    S6_ratings: ["moodys.com", "spglobal.com/ratings", "fitchratings.com"]
    S7_press: ["irishtimes.com/business", "businesspost.ie", "independent.ie/business", "rte.ie/news/business", "reuters.com"]
    S8_trade: ["siliconrepublic.com", "techcentral.ie"]
    S10_jobs: ["irishjobs.ie", "linkedin.com/jobs"]
    S11_tenders: ["etenders.gov.ie"]
  gcc:
    mode: inactive
    codes: [gcc-ae, gcc-sa, gcc-qa, gcc-kw, gcc-bh, gcc-om]
    arabic_query_weekly: true      # one Arabic query per account per week (Wednesday run)
    S3_exchange:
      gcc-ae: ["dfm.ae", "adx.ae", "nasdaqdubai.com"]
      gcc-sa: ["saudiexchange.sa (Tadawul)"]
      gcc-qa: ["qe.com.qa"]
      gcc-kw: ["boursakuwait.com.kw"]
      gcc-bh: ["bahrainbourse.com"]
      gcc-om: ["msx.om"]
    S3_registry: ["adgm.com (public register)", "difc.ae (public register)", "mc.gov.sa (CR)", "moci.gov.qa"]
    S5_regulators: ["sca.gov.ae", "dfsa.ae", "adgm.com/fsra", "cma.org.sa", "sama.gov.sa", "qfcra.com", "cbuae.gov.ae",
                    "gaca.gov.sa", "tdra.gov.ae", "cst.gov.sa", "zatca.gov.sa", "mof.gov.ae (e-invoicing)"]
    S5_state_media: ["wam.ae", "spa.gov.sa", "qna.org.qa", "kuna.net.kw", "bna.bh", "omannews.gov.om",
