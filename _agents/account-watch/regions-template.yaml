    S6_ratings: ["moodys.com", "spglobal.com/ratings", "fitchratings.com"]
    S7_press: ["wsj.com", "bloomberg.com", "reuters.com", "nytimes.com/section/business", "businessinsider.com", "theglobeandmail.com"]
    S8_trade: ["ciodive.com", "axios.com/pro", "theinformation.com", "supplychaindive.com"]
    S10_jobs: ["linkedin.com/jobs", "indeed.com"]
